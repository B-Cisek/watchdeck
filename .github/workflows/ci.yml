name: CI

on:
    pull_request:
    # Called by deploy.yml, so a push to main is checked before it is deployed.
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    # Only cancel superseded PR runs; never a run that a deploy is waiting on.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2

            - name: Install app dependencies
              uses: ramsey/composer-install@v3

            - name: Install tools
              uses: ramsey/composer-install@v3
              with:
                  working-directory: .tools

            - name: PHPStan
              run: .tools/vendor/bin/phpstan analyse -l 6 src tests --no-progress --error-format=github

            - name: PHP-CS-Fixer
              run: .tools/vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes --show-progress=none

    tests:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18.7-alpine
                env:
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                    # doctrine.yaml appends "_test" to the database name in the test env.
                    POSTGRES_DB: app_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U app -d app_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            APP_ENV: test
            DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=18&charset=utf8
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2

            - name: Install app dependencies
              uses: ramsey/composer-install@v3

            - name: Migrate test database
              run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

            - name: PHPUnit
              run: php bin/phpunit
